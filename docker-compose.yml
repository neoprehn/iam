services:
  neo4j:
    image: neo4j:5.26.27-community
    container_name: iam-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_import_file_enabled: "true"
      # false: apoc.load.json darf absolute Pfade lesen (rules unter /rules gemountet, read-only).
      NEO4J_apoc_import_file_use__neo4j__config: "false"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Speicher: Default (512MiB Pagecache, kein Heap-Limit) ist für die Importmengen
      # viel zu klein -> Plattenthrashing. Großzügig dimensionieren (Host hat reichlich RAM).
      NEO4J_server_memory_heap_initial__size: "8G"
      NEO4J_server_memory_heap_max__size: "8G"
      NEO4J_server_memory_pagecache_size: "4G"
      # 0 = kein Limit fuer parallele Transaktions-Speicher (noetig fuer grosse Batch-Importe wie AGR_1251)
      NEO4J_dbms_memory_transaction_total_max: "0"
    volumes:
      # DB als Named Volume (schnelle ext4-Platte IN der Docker-VM) — NICHT als Bind-Mount auf
      # den OneDrive-Pfad: dort ist DB-I/O (fsync) extrem langsam + OneDrive synchronisiert mit.
      - iam_neo4j_db:/data
      - ./data/import:/var/lib/neo4j/import   # file:///<name>.csv (AE-15)
      - ./data/logs:/logs
      - ./load:/load:ro                       # Load-Skripte für cypher-shell -f /load/...
      - ./cypher:/cypher:ro                    # Checks/SoD-Abfragen für cypher-shell -f /cypher/...
      - ./rules:/rules:ro                      # Rulesets (JSON) für apoc.load.json('file:///rules/...')
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Backend-API (Phase 9, Bau-Schritt 1): Runner-as-API ueber die vorhandenen cypher/-Dateien.
  # Orchestriert via Neo4j-Treiber (apoc.cypher.runFile liest /cypher im neo4j-Container) — daher
  # braucht der Backend-Container selbst nur config (Profile) + rules (Ruleset-Ordner-Mapping).
  backend:
    build:
      context: ./backend
    image: iam-backend:0.1.0
    container_name: iam-backend
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./config:/app/config  # RW: Org-Varianten-Editor schreibt analysis_profiles.custom.json
                              # (Overlay, getrennt von der Vendor-Quelle)
      - ./rules:/app/rules    # RW: Einzelfilter-Editor schreibt queries.custom.json (Overlay,
                              # getrennt von der Vendor-Quelle); neo4j-Mount bleibt :ro (liest nur)
      - ./checks:/app/checks:ro       # Konsistenzchecks-Katalog (JSON je Kategorie, kein Overlay in v1)
      - ./cypher:/app/cypher:ro       # Orchestrierte SoD-Statements (Treiber statt cypher-shell -f)
      - ./load:/app/load:ro           # Load-Skripte (Import-Job)
      - ./migrations:/app/migrations:ro  # Schema (idempotent, Import-Job)
      - ./data/import:/app/data/import   # SE16-.txt rein, .csv-Konvertat raus (RW) — bleibt lokal
      - ./data/logs:/app/data/logs     # persistentes Fehlerprotokoll (job_errors.jsonl, ueberlebt Neustart)
      - ./backups:/app/backups        # Dataset-Backups (.zip der bereinigten .csv) — bleibt lokal
      - ./frontend:/app/frontend:ro   # Minimale UI (statisch, vom Backend ausgeliefert)
      - ./backend/app.py:/app/app.py          # Hot-Reload: Aenderungen ohne Image-Rebuild wirksam
      - ./backend/convert.py:/app/convert.py  # Hot-Reload: Aenderungen ohne Image-Rebuild wirksam
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  # Schema-Migrationen (AE-02). Startet NICHT bei `docker compose up` (profile: tools).
  # Anwenden:  docker compose run --rm migrations
  # Status:    docker compose run --rm migrations info
  migrations:
    build:
      context: ./docker
      dockerfile: neo4j-migrations.Dockerfile
    image: iam-neo4j-migrations:4.1.0
    container_name: iam-migrations
    profiles: ["tools"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./migrations:/migrations

volumes:
  iam_neo4j_db:   # DB-Speicher (schnell, in der Docker-VM; ersetzt den OneDrive-Bind-Mount)
